name: keepalive

on:
  schedule:
    - cron: '*/8 * * * *'
  workflow_dispatch:

jobs:
  wake:
    runs-on: ubuntu-latest
    steps:
      - name: Ping CINDER health
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' 'https://cinder-4enr.onrender.com/health')
          echo "keepalive: ${code}"