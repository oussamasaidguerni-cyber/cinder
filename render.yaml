services:
  - type: web
    name: cinder
    runtime: python
    plan: free
    buildCommand: |
      pip install -r backend/requirements.txt
      cd frontend && npm ci && npm run build && cd ..
    startCommand: cd backend && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: NVIDIA_MODEL
        value: openai/gpt-oss-20b
      - key: NVIDIA_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_API_KEY
        sync: false
      - key: NVD_API_KEY
        sync: false
      - key: CINDER_DEMO_MODE
        value: "1"
      - key: CINDER_INVENTORY
        value: "paloaltonetworks:pan-os,apache:log4j,apache:http_server,fortinet:fortios"